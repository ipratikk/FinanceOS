query GetBanks {
  banks {
    id
    name
    code
  }
}

query GetLedgers {
  ledgers {
    id
    displayName
    kind
    last4
    bank {
      id
      name
      code
    }
    balance {
      value
      currencyCode
    }
    lastStatementAt
  }
}

query GetLedger($id: ID!) {
  ledger(id: $id) {
    id
    displayName
    kind
    last4
    bank {
      id
      name
      code
    }
    balance {
      value
      currencyCode
    }
  }
}

query GetTransactions($ledgerId: ID, $filter: TransactionFilter, $limit: Int) {
  transactions(ledgerId: $ledgerId, filter: $filter, limit: $limit) {
    id
    date
    narration
    amount {
      value
      currencyCode
    }
    category
    merchant
    sourceFingerprint
    ledger {
      id
      displayName
    }
  }
}

query GetAnalytics($ledgerId: ID, $from: String, $to: String) {
  analytics(ledgerId: $ledgerId, from: $from, to: $to) {
    totalSpend {
      value
      currencyCode
    }
    totalIncome {
      value
      currencyCode
    }
    netFlow {
      value
      currencyCode
    }
    byCategory {
      category
      amount {
        value
        currencyCode
      }
      count
    }
    byMonth {
      month
      spend {
        value
        currencyCode
      }
      income {
        value
        currencyCode
      }
    }
  }
}
